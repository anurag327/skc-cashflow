<!DOCTYPE html>
<html>
<head>
  <title>SKC Real Estate</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      display: flex;
    }

    .sidebar {
      width: 250px;
      height: 100vh;
      background: linear-gradient(#0f3d3e, #0b2d2e);
      color: white;
      padding: 20px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo img {
      width: 120px;
    }

    .menu p {
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .menu p:hover {
      background: #c8a95a;
      color: black;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    h1 {
      color: #0f3d3e;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      margin: 5px;
    }

    button {
      padding: 10px 15px;
      background: #0f3d3e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    table {
      width: 100%;
      background: white;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #0f3d3e;
      color: white;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <div class="logo">
    <img src="logo.png">
  </div>

  <div class="menu">
    <p>Dashboard</p>
    <p>Add Transaction</p>
    <p>Pending</p>
  </div>
</div>

<div class="main">

  <h1>SKC REAL ESTATE</h1>

  <!-- CARDS -->
  <div class="cards">
    <div class="card">
      <h3>Total Received</h3>
      <p id="totalReceived">₹0</p>
    </div>

    <div class="card">
      <h3>Total Given</h3>
      <p id="totalGiven">₹0</p>
    </div>

    <div class="card">
      <h3>Balance</h3>
      <p id="balance">₹0</p>
    </div>
  </div>

  <!-- ADD FORM -->
  <div class="form">
    <h2>Add Transaction</h2>
    <input id="from" placeholder="From ID">
    <input id="to" placeholder="To ID">
    <input id="amount" placeholder="Amount">
    <br><br>
    <button onclick="addTransaction()">Submit</button>
  </div>

  <!-- PENDING TABLE -->
  <h2>Pending Transactions</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>From</th>
        <th>To</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="pendingTable"></tbody>
  </table>

</div>

<script>
const API = "http://localhost:3000";

// ADD TRANSACTION
async function addTransaction() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const amount = document.getElementById("amount").value;

  await fetch(API + "/transaction", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      type: "receive",
      amount,
      from_user_id: from,
      to_user_id: to,
      remark: "UI"
    })
  });

  loadPending();
}

// LOAD PENDING
async function loadPending() {
  const res = await fetch(API + "/pending");
  const data = await res.json();

  const table = document.getElementById("pendingTable");
  table.innerHTML = "";

  data.forEach(t => {
    table.innerHTML += `
      <tr>
        <td>${t.id}</td>
        <td>₹${t.amount}</td>
        <td>${t.from_user_id}</td>
        <td>${t.to_user_id}</td>
        <td><button onclick="approve(${t.id})">Approve</button></td>
      </tr>
    `;
  });
}

// APPROVE
async function approve(id) {
  await fetch(API + "/approve/" + id, { method: "POST" });
  loadPending();
}

// LOAD BALANCE
async function loadBalance() {
  const res = await fetch(API + "/balance/4");
  const data = await res.json();

  document.getElementById("totalReceived").innerText = "₹" + data.received;
  document.getElementById("totalGiven").innerText = "₹" + data.given;
  document.getElementById("balance").innerText = "₹" + data.balance;
}

// INIT
loadPending();
loadBalance();
</script>

</body>
</html>
